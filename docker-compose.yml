# UniMate stack — 1 VPS + Caddy ngoài, mỗi service 1 port.
#
# CÁCH 1 (mặc định):  docker compose --env-file .env.docker up -d --build
#   MySQL/RustFS nội bộ; backend :3000, admin :8080, client :8081 mở trên BIND_ADDR
#   (mặc định 127.0.0.1). Caddy NGOÀI do bạn quản lý trỏ 3 domain về 3 port này.
# CÁCH 2 (all-in-one): thêm  --profile edge  để bật Caddy nội bộ (HTTPS tự động,
#   dùng API_DOMAIN/ADMIN_DOMAIN/CLIENT_DOMAIN).
# Nhiều máy: service nào ở máy nào thì đổi *_HOST/*_URL tương ứng + mở BIND_ADDR=0.0.0.0
# (compose mặc định đọc .env của dev nên BẮT BUỘC chỉ định --env-file)

name: unimate

services:
  mysql:
    # 9.7 = LTS mới nhất (Oracle hỗ trợ tới 21/04/2034). KHÔNG dùng :latest vì đó là
    # bản Innovation (chỉ hỗ trợ 6 tháng). MySQL 8.0 đã EOL từ 21/04/2026.
    image: mysql:9.7
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: unimate
      MYSQL_USER: ${MYSQL_USER:-unimate}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mysql-data:/var/lib/mysql
      # Chạy 1 lần duy nhất khi volume còn trống (tạo schema + seed RBAC/payment/shipping)
      - ./docker/mysql-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # 127.0.0.1 ép đi TCP (localhost dùng socket, báo healthy sớm gây backend lỗi kết nối)
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped
    networks:
      - appnet
    # Backend ở máy khác mới cần mở: đổi BIND_ADDR=0.0.0.0 + DB_HOST=<ip-may-mysql>
    # ports:
    #   - "127.0.0.1:3306:3306"

  backend:
    build: .
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_HOST: ${DB_HOST:-mysql}
      DB_PORT: ${DB_PORT:-3306}
      DB_USER: ${MYSQL_USER:-unimate}
      DB_PASSWORD: ${MYSQL_PASSWORD}
      DB_NAME: unimate
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 30d
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
      # Sau Caddy HTTPS thật thì =1; test HTTP thuần thì =0 trong .env.docker
      FORCE_HTTPS: ${FORCE_HTTPS:-1}
      TRUST_PROXY: 1
      COOKIE_SECURE: ${COOKIE_SECURE:-1}
      # Object storage (RustFS nội bộ hoặc S3/R2 ngoài). Thiếu → API /media/upload trả 503
      S3_ENDPOINT: ${S3_ENDPOINT:-http://objectstore:9000}
      S3_REGION: us-east-1
      S3_BUCKET: ${S3_BUCKET:-unimate}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_PUBLIC_URL: ${S3_PUBLIC_URL}
      S3_MAX_IMAGE_MB: ${S3_MAX_IMAGE_MB:-10}
      S3_MAX_VIDEO_MB: ${S3_MAX_VIDEO_MB:-100}
      S3_MAX_FILE_MB: ${S3_MAX_FILE_MB:-20}
      # SMTP gui email marketing (thieu -> API /email tra 503)
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
    ports:
      - "${BIND_ADDR:-127.0.0.1}:3000:3000"
    depends_on:
      mysql:
        condition: service_healthy
      objectstore:
        condition: service_started
    restart: unless-stopped
    networks:
      - appnet

  # Kho object storage cho ảnh/video/tệp (tương thích S3, thay R2/AWS được qua S3_*)
  # RustFS: bản viết lại MinIO bằng Rust, giấy phép Apache 2.0 (MinIO dùng AGPL và đã
  # archive bản community 25/04/2026, gỡ khỏi Docker Hub). Cùng port 9000/9001.
  objectstore:
    image: rustfs/rustfs:latest
    # Image chạy user non-root (UID 10001) nên không tạo được thư mục dữ liệu trên volume
    # do Docker tạo (owner root) → ép root. Chỉ dùng cho stack local.
    user: root
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY}
      RUSTFS_VOLUMES: /data
    volumes:
      - objectstore-data:/data
    ports:
      - "${BIND_ADDR:-127.0.0.1}:9000:9000"
      - "127.0.0.1:9001:9001"
    restart: unless-stopped
    networks:
      - appnet

  # Trang quan tri (build tu ../admin, nginx). Đổi ADMIN_API_BASE/ADMIN_FILES_BASE
  # phải build lại
  admin:
    build:
      context: ../admin
      args:
        VITE_API_BASE: ${ADMIN_API_BASE:-https://api.example.com/api}
        VITE_FILES_BASE: ${ADMIN_FILES_BASE:-https://api.example.com/files/unimate}
    ports:
      - "${BIND_ADDR:-127.0.0.1}:8080:80"
    restart: unless-stopped
    networks:
      - appnet

  # Web ban hang (build tu ../client, nginx). Đổi CLIENT_*_BASE phải build lại
  client:
    build:
      context: ../client
      args:
        VITE_API_BASE: ${CLIENT_API_BASE:-https://api.example.com/api}
        VITE_FILES_BASE: ${CLIENT_FILES_BASE:-https://api.example.com/files/unimate}
    ports:
      - "${BIND_ADDR:-127.0.0.1}:8081:80"
    restart: unless-stopped
    networks:
      - appnet

  # Caddy NỘI BỘ — chỉ chạy với --profile edge (all-in-one, HTTPS tự động).
  # Có Caddy ngoài rồi thì KHÔNG dùng service này (tránh chiếm 80/443).
  caddy:
    profiles: ["edge"]
    image: caddy:latest
    ports:
      - "80:80"
      - "443:443"
      - "8080:8080"
      - "8081:8081"
    volumes:
      - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    environment:
      API_DOMAIN: ${API_DOMAIN}
      ADMIN_DOMAIN: ${ADMIN_DOMAIN:-http://127.0.0.1:8080}
      CLIENT_DOMAIN: ${CLIENT_DOMAIN:-http://127.0.0.1:8081}
    depends_on:
      - backend
      - admin
      - client
    restart: unless-stopped
    networks:
      - appnet

volumes:
  mysql-data:
  objectstore-data:
  # Caddy chỉ chạy với --profile edge nên 2 volume dưới đây KHÔNG được tạo
  # khi chạy mặc định (docker chỉ tạo volume của service đang khởi động).
  caddy-data:
  caddy-config:

networks:
  appnet:
    driver: bridge
